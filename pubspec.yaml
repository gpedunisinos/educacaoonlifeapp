name: unisinos_usp_app
description: "Unisinos USP  App"
publish_to: "none"

version: 0.3.0+6

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  get: ^4.3.8
  intl: any
  http: any
  flutter_svg: ^1.1.6
  flutter_markdown: ^0.7.7+1
  flutter_colorpicker: ^1.0.3
  http_interceptor: ^2.0.0
  package_info_plus: ^8.3.1
  pvalidator: ^1.6.0
  shared_preferences: ^2.5.3
  pin_code_fields: ^8.0.1
  smooth_page_indicator: ^1.2.1
  percent_indicator: ^4.2.5
  google_sign_in: ^6.2.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.2.10
  firebase_crashlytics: ^4.0.4
  flutter_local_notifications: ^19.4.2
  dio: ^5.9.0

  widgets_spo:
    git:
      url: https://bitbucket.org/spotecnologia/widgets_spo.git
      ref: v1.2.4

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  syncfusion_flutter_charts: ^30.2.6+1
  collection: ^1.19.1
  dynamic_path_url_strategy: ^1.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/google_icon.svg
    - assets/logo.svg
    - assets/assessment.png
    - assets/assessment_list.png
    - assets/certificate.png
    - assets/offline_class.png
    - assets/charts.png
    - assets/logo_unisinos.png
    - assets/logo_usp.png
    - assets/rieonlife/hub_conectakat.jpeg
    - assets/rieonlife/hub_controladora.png
    - assets/rieonlife/hub_educacao_corporativa.png
    - assets/rieonlife/hub_empreendedorismo.png
    - assets/rieonlife/hero.jpg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
