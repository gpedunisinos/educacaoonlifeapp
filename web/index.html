<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta name="google-signin-client_id"
    content="431431134667-um6jg495v89qp5blfkdimi585s2jqfmm.apps.googleusercontent.com" />

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8" />
  <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
  <meta name="description" content="Educação OnLIFE" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Educação OnLIFE" />
  <link rel="apple-touch-icon" href="favicon.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Desabilita cache apenas do index (garante sincronismo com main.dart.js) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Educação OnLIFE</title>

</head>

<body>
  <!-- PDF.js import seguro -->
  <script defer type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs";
    window.pdfjsLib = pdfjsLib;

    // Evita cache legado do flutter_service_worker causando drift de assets/fontes.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => {
          const scriptUrl = registration.active?.scriptURL ?? registration.waiting?.scriptURL ?? registration.installing?.scriptURL ?? '';
          if (scriptUrl.includes('flutter_service_worker.js') || scriptUrl.includes('firebase-messaging-sw.js')) {
            registration.unregister();
          }
        });
      });
    }

  </script>

  <!-- Bootstrap padrão do Flutter -->
  <script src="flutter_bootstrap.js" defer></script>
</body>

</html>
