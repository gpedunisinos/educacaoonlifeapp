<VirtualHost *:80>
    ServerName educacaoonlife.gpedu.com.br
    DocumentRoot /var/www/usp_app
    <Directory /var/www/usp_app>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://educacaoonlife.gpedu.com.br%{REQUEST_URI} [END,NE,R=301]
</VirtualHost>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName educacaoonlife.gpedu.com.br
    DocumentRoot /var/www/usp_app
    <Directory /var/www/usp_app>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    SSLCertificateFile /etc/letsencrypt/live/educacaoonlife.gpedu.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/educacaoonlife.gpedu.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
